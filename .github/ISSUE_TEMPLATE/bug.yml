name: Something's broken
description: Found something that isn't working? Tell us what happened.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve Hack SP.

        Tell us what happened and we'll take a look.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem as clearly as you can.
      placeholder: I expected... but instead...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Tell us what you were doing when the problem happened.
      placeholder: |
        1. Go to...
        2. Click...
        3. See...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, recordings, browser information or anything else that could help.
    validations:
      required: false